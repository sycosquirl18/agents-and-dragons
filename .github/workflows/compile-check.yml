name: Check compiled workflows

# The .lock.yml files are what GitHub actually runs. If someone edits an agent's frontmatter and forgets
# `gh aw compile`, the change silently does nothing. This catches that.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pin the compiler to whatever version produced the committed lock files, otherwise a new gh-aw release
      # rewrites them and this check fails on every unrelated PR. Upgrading is: recompile locally, commit,
      # and CI follows automatically.
      - name: Read the gh-aw version the lock files were built with
        id: ver
        run: |
          v=$(grep -m1 -oE 'generated by gh-aw \(v[0-9]+\.[0-9]+\.[0-9]+' \
                .github/workflows/dungeon-master.lock.yml | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$v" ]; then echo "::error::Could not read the gh-aw version from the lock file."; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Lock files were compiled with gh-aw $v"

      - uses: github/gh-aw/actions/setup-cli@main
        with:
          version: ${{ steps.ver.outputs.version }}

      - name: Recompile agents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh aw compile

      - name: Fail if lock files are stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Compiled .lock.yml files are out of date. Run 'gh aw compile' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "All agent lock files are up to date."
