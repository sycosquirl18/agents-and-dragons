name: Check the Codex

# Mechanical consistency gate on the world data. Auto-merge will not land a PR whose checks are failing, so this is
# what stops an agent from quietly breaking every link in the Codex at 3am.

on:
  pull_request:
    paths:
      - "codex/**"
      - "scripts/check-codex.mjs"
  push:
    branches: [main]
    paths:
      - "codex/**"
      - "scripts/check-codex.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-codex.mjs
