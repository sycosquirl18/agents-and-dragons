name: Auto-merge codex updates

# Agent jobs are read-only by design: gh-aw captures their edits and opens a PR. This is the other half of the loop —
# it lands those PRs so the world can actually advance without a human in the way.
#
# It only ever touches PRs that are (a) labelled `codex-update`, (b) authored by a bot, and (c) touching nothing
# outside codex/. Anything else is left for a human. Remove the `codex-update` label to veto a change.
#
# This job runs the Codex check itself rather than trusting the PR's own checks, because on an agent's PR there
# aren't any. GitHub does not run workflows for events raised by GITHUB_TOKEN: a PR opened by the safe-outputs job
# gets its `pull_request` runs parked in an approval-required state, waiting for a human to press a button. Waiting
# for a human is the one thing this repository cannot do. So the sweep performs the merge locally, runs
# `check-codex.mjs` on the merged tree, and only lands the PR if the world still holds together.
#
# See docs/operations.md#the-write-loop.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Merge eligible codex PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --repo "$REPO" --state open --label codex-update \
                  --json number,author,isDraft,files,mergeable,statusCheckRollup --limit 30)

          echo "$prs" | jq -c '.[]' | while read -r pr; do
            num=$(echo "$pr" | jq -r '.number')
            author=$(echo "$pr" | jq -r '.author.login')
            draft=$(echo "$pr" | jq -r '.isDraft')
            mergeable=$(echo "$pr" | jq -r '.mergeable')

            echo "::group::PR #$num (author=$author mergeable=$mergeable)"

            if [ "$draft" = "true" ]; then
              echo "skip: draft"; echo "::endgroup::"; continue
            fi

            # Only bots. A human PR wearing this label still gets reviewed by a human.
            case "$author" in
              *"[bot]"|github-actions|Copilot) ;;
              *) echo "skip: human author"; echo "::endgroup::"; continue ;;
            esac

            # Blast radius: agents may only rewrite the world, never the machinery that runs it.
            stray=$(echo "$pr" | jq -r '.files[].path' | grep -v '^codex/' || true)
            if [ -n "$stray" ]; then
              echo "skip: touches files outside codex/:"; echo "$stray"
              gh pr edit "$num" --repo "$REPO" --add-label needs-review
              gh pr comment "$num" --repo "$REPO" --body \
                "Held for review: this PR changes files outside \`codex/\`, which auto-merge will not do unattended."
              echo "::endgroup::"; continue
            fi

            # A genuinely red check still vetoes. Queued and action_required do not — that is the permanent resting
            # state of a run GitHub created but will not start, and blocking on it would stall the world forever.
            failed=$(echo "$pr" | jq -r '[.statusCheckRollup[]? | select(.conclusion=="FAILURE" or .conclusion=="TIMED_OUT" or .conclusion=="STARTUP_FAILURE")] | length')
            if [ "$failed" != "0" ]; then
              echo "skip: $failed failing check(s)"
              gh pr edit "$num" --repo "$REPO" --add-label needs-review
              echo "::endgroup::"; continue
            fi

            # Validate the merge *result*, not the branch: two agents can each write a perfectly valid Codex whose
            # union has a dangling link. `merge-tree` computes that result in memory — it never touches the working
            # tree, so nothing leaks between PRs and there is no dirty-state failure mode. Recomputed against
            # current main every time, so a merge earlier in this same sweep is already accounted for.
            git fetch -q origin main
            git fetch -q origin "pull/$num/head"

            if ! tree=$(git merge-tree --write-tree FETCH_HEAD origin/main 2>/dev/null); then
              echo "conflicting — attempting update-branch"
              if gh pr update-branch "$num" --repo "$REPO" --rebase; then
                echo "rebased; next sweep will land it"
              else
                gh pr edit "$num" --repo "$REPO" --add-label needs-rebase
                echo "skip: unresolvable conflict"
              fi
              echo "::endgroup::"; continue
            fi

            rm -rf /tmp/merged && mkdir -p /tmp/merged
            git archive "$tree" | tar -x -C /tmp/merged

            if ! report=$(cd /tmp/merged && node scripts/check-codex.mjs 2>&1); then
              echo "skip: the Codex check fails on the merge result"
              echo "$report"
              gh pr edit "$num" --repo "$REPO" --add-label needs-review
              gh pr comment "$num" --repo "$REPO" --body "$(printf 'Held for review: merging this would leave the Codex inconsistent.\n\n```\n%s\n```\n\nFix it on the branch, or drop the `codex-update` label to retire it.\n' "$report")"
              echo "::endgroup::"; continue
            fi
            echo "$report"

            if gh pr merge "$num" --repo "$REPO" --squash --delete-branch; then
              echo "merged #$num"
            else
              echo "merge failed for #$num; leaving it for the next sweep"
            fi
            echo "::endgroup::"
          done
